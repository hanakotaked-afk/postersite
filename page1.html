      <ul>
        <li>・ベタ塗りの図形と立体感のある図形が含まれている<br>・それぞれの図形のサイズは同じくらい<br>→ポスター全体に目がいく</li>
        <li>・ベタ塗りの図形は背景との明度差が小さく、立体の図形は明度差が大きい<br>→ベタ塗りの図形が沈んで見えて、立体が目立つようになっている</li>
        <li>・ベタ塗りの図形は彩度が高いのに対し、立体感のある図形は無彩色<br>→対比を作っている、より立体感がわかりやすい</li>
        <li>・図形はシンプルな形</li>
